name: Interfaz

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  navegador:
    name: Interfaz en Chromium
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instala dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: Estilo (pyflakes)
        run: python -m ruff check --isolated --select F steam_families.py pruebas

      - name: Pruebas de interfaz
        run: python -m unittest discover -s pruebas -p "test_interfaz.py" -v
