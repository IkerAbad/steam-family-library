name: Paquete

on:
  workflow_dispatch:

jobs:
  paquete:
    name: Ejecutable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: steam-families
            binario: dist/steam-families.exe
            artefacto: steam-families-windows
          - os: ubuntu-latest
            nombre: steam-families-linux
            binario: dist/steam-families-linux
            artefacto: steam-families-linux
          - os: macos-latest
            nombre: steam-families-macos
            binario: dist/steam-families-macos
            artefacto: steam-families-macos
          - os: macos-15-intel
            nombre: steam-families-macos-intel
            binario: dist/steam-families-macos-intel
            artefacto: steam-families-macos-intel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instala dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Empaqueta
        run: python empaquetar.py --nombre ${{ matrix.nombre }}

      - name: Comprueba el ejecutable
        run: ${{ matrix.binario }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: ${{ matrix.binario }}
