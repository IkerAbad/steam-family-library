name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binarios:
    name: Binario (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: steam-families
            binario: dist/steam-families.exe
          - os: ubuntu-latest
            nombre: steam-families-linux
            binario: dist/steam-families-linux
          - os: macos-latest
            nombre: steam-families-macos
            binario: dist/steam-families-macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instala dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Empaqueta
        run: python empaquetar.py --nombre ${{ matrix.nombre }}

      - name: Comprueba el ejecutable
        run: ${{ matrix.binario }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.binario }}

  publicar:
    name: Publica la release
    needs: binarios
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Crea la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python notas_release.py "$GITHUB_REF_NAME" > notas.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Steam Families $GITHUB_REF_NAME" \
            --notes-file notas.md \
            dist/*
