name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: Windows con Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compila
        run: python -m py_compile steam_families.py

      - name: Pruebas unitarias
        run: python -m unittest discover -s pruebas -v

      - name: Pruebas de plataforma (Windows)
        run: python -m unittest discover -s pruebas_plataforma -p "test_windows.py" -v

      - name: Cobertura
        if: matrix.python == '3.12'
        run: |
          python -m pip install coverage
          python -m coverage run --source=. -m unittest discover -s pruebas
          python -m coverage run --append --source=. -m unittest discover -s pruebas_plataforma -p "test_windows.py"
          python -m coverage report --include="steam_families.py,empaquetar.py,notas_release.py" --fail-under=90
          python -m coverage html
          python -m coverage xml
          python -m coverage report --include="steam_families.py,empaquetar.py,notas_release.py" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: cobertura-windows
          path: |
            htmlcov
            coverage.xml

      - name: Rutas raras
        shell: pwsh
        run: |
          $err = Join-Path $env:TEMP "error_ruta.txt"
          python steam_families.py --exportar --datos 'C:\x<y' --token x 2> $err
          $codigo = $LASTEXITCODE
          if ($codigo -ne 1) { throw "una ruta con < deberia salir con 1, salio con $codigo" }
          if (-not (Select-String -Path $err -Pattern "caracteres no v" -Quiet)) {
            throw "mensaje inesperado: " + (Get-Content $err -Raw)
          }
          Write-Host "rechaza la ruta con el mensaje correcto"
          $global:LASTEXITCODE = 0

      - name: El lanzador .cmd arranca y responde
        shell: pwsh
        run: |
          Start-Process -FilePath ".\iniciar.cmd" -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8087/api/estado" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Milliseconds 500
          }
          try {
            Invoke-WebRequest -Uri "http://127.0.0.1:8087/api/detener" -Method Post `
              -ContentType "application/json" -Body "{}" -UseBasicParsing -TimeoutSec 5 | Out-Null
          } catch {}
          if (-not $ok) { throw "el lanzador .cmd no ha respondido en 20 segundos" }
          Start-Sleep -Seconds 2
          $procesos = Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
            Where-Object { $_.CommandLine -like "*steam-family-library*" }
          if ($procesos) { throw "quedan procesos de python vivos" }
          if (Test-Path ".\datos\library.csv") { "el lanzador escribio en datos (ignorado por git)" }
          $global:LASTEXITCODE = 0
