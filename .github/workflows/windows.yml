name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: Windows con Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compila los tres scripts
        run: python -m py_compile steam_family_library.py panel.py app.py

      - name: Pruebas unitarias
        run: python -m unittest discover -s pruebas -v

      - name: Rutas raras
        shell: pwsh
        run: |
          python steam_family_library.py --datos 'C:\x<y' --token x
          if ($LASTEXITCODE -ne 1) { throw "una ruta con < deberia fallar" }

      - name: El lanzador .cmd arranca y responde
        shell: pwsh
        run: |
          Start-Process -FilePath ".\iniciar.cmd" -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8087/api/estado" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Milliseconds 500
          }
          try {
            Invoke-WebRequest -Uri "http://127.0.0.1:8087/api/detener" -Method Post `
              -ContentType "application/json" -Body "{}" -UseBasicParsing -TimeoutSec 5 | Out-Null
          } catch {}
          if (-not $ok) { throw "el lanzador .cmd no ha respondido en 20 segundos" }
          Start-Sleep -Seconds 2
          $procesos = Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
            Where-Object { $_.CommandLine -like "*steam-family-library*" }
          if ($procesos) { throw "quedan procesos de python vivos" }
          if (Test-Path ".\library.csv") { "el lanzador escribio en la carpeta del repo (ignorado por git)" }
