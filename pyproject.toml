[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-families-library"
version = "3.1.1"
description = "Export your Steam family library, see which games are yours and what has entered since the last check, with a local web panel."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Iker Abad" }]
keywords = ["steam", "library", "family", "games", "sharing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/IkerAbad/steam-family-library"
Repository = "https://github.com/IkerAbad/steam-family-library"
Changelog = "https://github.com/IkerAbad/steam-family-library/blob/main/CHANGELOG.md"

[project.scripts]
steam-families = "steam_families:main"

[tool.setuptools]
py-modules = ["steam_families"]
